---
# Packages to install: the RustFS server and the RustFS client (rc)
rustfs_package_names:
  - rustfs
  - rustfs-cli

# Path to the RustFS server binary (used by the systemd unit)
rustfs_server_bin: "/usr/local/bin/rustfs"

# Path to the RustFS client binary (used to create buckets)
rustfs_client_bin: "/usr/bin/rc"

# Name of the RustFS server service (systemd unit)
rustfs_service_name: rustfs

# Runtime user and group for the RustFS server service.
# Hosts migrated from Minio set this to `minio`.
rustfs_user: rustfs
rustfs_group: "{{ rustfs_user }}"

# Working directory of the RustFS server service
rustfs_server_workdir: /opt/rustfs

# Path to the file containing the ENV variables for the RustFS server
rustfs_server_envfile: /etc/default/rustfs

# RustFS server S3 API listen address (`[host]:port`).
# Ports below 1024 grant CAP_NET_BIND_SERVICE to the systemd service.
rustfs_server_addr: ":9091"

# Enable the RustFS console (web UI), and its listen address (`[host]:port`).
# Ports below 1024 grant CAP_NET_BIND_SERVICE to the systemd service.
rustfs_server_console_enable: true
rustfs_server_console_addr: ":9001"

# RustFS server data directories. Created by the role and used as
# RUSTFS_VOLUMES when `rustfs_server_cluster_nodes` is empty.
# Hosts migrated from Minio set this to Minio's data dirs (`/var/lib/minio`).
rustfs_server_datadirs:
  - "/var/lib/rustfs"

# RustFS server cluster node list (e.g. `https://rustfs{1...4}/var/lib/rustfs`).
# When set, it is used as RUSTFS_VOLUMES instead of `rustfs_server_datadirs`.
rustfs_server_cluster_nodes: []

# Additional environment variables to be set in the RustFS server environment.
# Added verbatim to `rustfs_server_envfile`, e.g. "RUSTFS_REGION=eu-west-1".
rustfs_server_env_extra: ""

# RustFS access and secret keys. Set as RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY
# for the server, and used by the client to connect. Override these!
rustfs_access_key: "AWSKEY"
rustfs_secret_key: "AWSSECRET"

# Internal: default client endpoint config, merged with `rustfs_endpoint`
__rustfs_endpoint_defaults:
  url: "https://{{ ansible_facts.fqdn }}:{{ rustfs_server_addr.split(':')[-1] }}"
  access_key: "{{ rustfs_access_key }}"
  secret_key: "{{ rustfs_secret_key }}"
  bucket_lookup: auto

# Overrides for the client endpoint config (keys: url, access_key, secret_key,
# bucket_lookup: `auto`, `path` or `dns`). Merged on top of
# `__rustfs_endpoint_defaults` and used for the rc `rustfs` alias and for the
# startup health check.
rustfs_endpoint: {}

# Buckets to create (with rc) after RustFS has started
rustfs_buckets:
  - mybucket

# Config directory of the RustFS client (rc), in the home dir of `rustfs_user`
rustfs_client_configdir: "{{ getent_passwd[rustfs_user][4] }}/.config/rc"

# Skip TLS certificate verification in the rc client
rustfs_insecure: false

# Options added to rc commands (e.g. when creating buckets)
rustfs_cli_options: "--ignore-existing"

# Directory with the RustFS server certificate, key and CA chain
# (`rustfs_cert.pem`, `rustfs_key.pem` and `ca.crt`), set as RUSTFS_TLS_PATH
rustfs_tls_path: /etc/rustfs/tls

# Whether certificates are managed (e.g. by chainsmith). When true, the role
# asserts that `rustfs_client_cert`, `rustfs_server_cert`, `rustfs_server_key`
# and `rustfs_server_chain` contain multi-line values.
rustfs_cert_managed: true
# Deploy certs from the `body` strings in `rustfs_cert_files` (true), or copy
# them from the `source` files in `rustfs_cert_files` (false)
rustfs_cert_from_string: "{{ rustfs_cert_managed }}"
# When copying certs from file: `source` is on the managed host (true) or on
# the Ansible controller (false)
rustfs_cert_remote: "{{ not rustfs_cert_from_string }}"

# Certificate data (PEM) used when `rustfs_cert_from_string` is true:
# CA chain trusted by the client, server certificate, server private key
# and server CA chain
rustfs_client_cert: "---- CERT ----"
rustfs_server_cert: "---- CERT ----"
rustfs_server_key: "---- KEY ----"
rustfs_server_chain: "---- CHAIN ----"

# CA bundle (PEM) used by rc to verify the server certificate. Defaults to
# the client CA chain deployed from `rustfs_client_cert` (`client_chain` in
# `rustfs_cert_files`); empty means the system CAs.
rustfs_client_ca_bundle: >-
  {{ rustfs_client_configdir ~ '/ca.pem' if rustfs_cert_from_string | bool
     else '' }}

# Directories to create for certificates (key: name, value: path and owner).
# The client config dir is created with the rc config.
rustfs_cert_folders:
  server:
    path: "{{ rustfs_tls_path }}"
    owner: "{{ rustfs_user }}"

# Certificate files to deploy. Each entry has a destination `path`, an
# `owner`, the `body` (used when `rustfs_cert_from_string` is true) and an
# optional `source` file (used when `rustfs_cert_from_string` is false)
rustfs_cert_files:
  client_chain:
    path: "{{ rustfs_client_ca_bundle }}"
    body: "{{ rustfs_client_cert }}"
    owner: "{{ rustfs_user }}"
  server_cert:
    path: "{{ rustfs_tls_path }}/rustfs_cert.pem"
    body: "{{ rustfs_server_cert }}"
    owner: "{{ rustfs_user }}"
    source: "/etc/pki/rustfs/server.crt"
  server_key:
    path: "{{ rustfs_tls_path }}/rustfs_key.pem"
    body: "{{ rustfs_server_key }}"
    owner: "{{ rustfs_user }}"
    source: "/etc/pki/rustfs/server.key"
  server_chain:
    path: "{{ rustfs_tls_path }}/ca.crt"
    body: "{{ rustfs_server_chain }}"
    owner: "{{ rustfs_user }}"
    source: "/etc/pki/rustfs/root.crt"

# Replace Minio by RustFS. When true, the role stops and removes Minio (its
# data directories are kept: point `rustfs_server_datadirs` at them). When
# false, the role fails on hosts where Minio is still installed, as both use
# the same ports. This is one-way: Minio can't take over RustFS data.
rustfs_remove_minio: false

# Minio service, packages and envfile removed with `rustfs_remove_minio`
rustfs_minio_service_name: minio
rustfs_minio_package_names:
  - minio
  - mcli
rustfs_minio_server_envfile: /etc/default/minio

# Minio server package: when installed, Minio is considered present (the
# client in `rustfs_minio_package_names` doesn't conflict with RustFS)
rustfs_minio_server_package: minio

# Minio unit files and init.d script outside package management, detected
# and removed with `rustfs_remove_minio`. Units in /usr/lib are removed with
# the packages.
rustfs_minio_unit_files:
  - "/etc/systemd/system/{{ rustfs_minio_service_name }}.service"
  - "/usr/local/lib/systemd/system/{{ rustfs_minio_service_name }}.service"
  - "/etc/init.d/{{ rustfs_minio_service_name }}"
