---
galaxy_info:
  namespace: pgvillage
  role_name: rustfs
  author: S. Mannem
  description: |
    RustFS is an S3 compatible object storage server.
    PgVillage uses it to store backups in S3 buckets on a filesystem.
    This role installs and configures RustFS, and can replace Minio by RustFS.
  company: Nibble-IT
  license: PostgreSQL
  min_ansible_version: "2.15"

  platforms:
    - name: EL
      versions:
        - "9"
        - "10"
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - bookworm
        - trixie

  galaxy_tags:
    - system
    - rustfs
    - storage
    - objectstorage
    - s3

dependencies: []
