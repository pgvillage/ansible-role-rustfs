---
- name: Converge
  hosts: all
  pre_tasks:
    # Certificates are passed as strings, as chainsmith does
    - name: Read the test certificates made in prepare
      ansible.builtin.slurp:
        src: "/etc/pki/rustfs/{{ item }}"
      loop: [root.crt, server.crt, server.key]
      register: test_certs

    - name: Pass the test certificates to the role
      ansible.builtin.set_fact:
        rustfs_client_cert: "{{ certs['root.crt'] }}"
        rustfs_server_cert: "{{ certs['server.crt'] }}"
        rustfs_server_key: "{{ certs['server.key'] }}"
        rustfs_server_chain: "{{ certs['root.crt'] }}"
      vars:
        certs: >-
          {{ dict(test_certs.results | map(attribute='item')
                  | zip(test_certs.results | map(attribute='content')
                        | map('b64decode'))) }}
  roles:
    - role: pgvillage.rustfs
