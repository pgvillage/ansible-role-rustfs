---
- name: Prepare
  hosts: all
  vars:
    pgvillage_yum_repo: https://repo.pgvillage.org/yum/v0.3.8
    pgvillage_apt_repo: https://repo.pgvillage.org/apt/v0.0.4
    cert_dir: /etc/pki/rustfs
  tasks:
    - name: Install openssl
      ansible.builtin.package:
        name: openssl
        state: present

    - name: Add the pgvillage yum repo, so the role installs packages by name
      ansible.builtin.yum_repository:
        name: pgvillage
        description: pgvillage packages
        baseurl: "{{ pgvillage_yum_repo }}/el$releasever/$basearch/"
        gpgcheck: true
        gpgkey: https://repo.pgvillage.org/yum/pgvillage.asc
      when: ansible_facts.os_family == 'RedHat'

    - name: Add the pgvillage apt repo
      when: ansible_facts.os_family == 'Debian'
      block:
        - name: Download the pgvillage apt signing key
          ansible.builtin.get_url:
            url: "{{ pgvillage_apt_repo }}/pgvillage.asc"
            dest: /etc/apt/keyrings/pgvillage.asc
            mode: "0644"

        - name: Add the pgvillage apt source
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/pgvillage.list
            content: >
              deb [signed-by=/etc/apt/keyrings/pgvillage.asc]
              {{ pgvillage_apt_repo }} {{ ansible_facts.distribution_release }} main
            mode: "0644"

        - name: Update the apt cache
          ansible.builtin.apt:
            update_cache: true

    - name: Create the certificate directory
      ansible.builtin.file:
        path: "{{ cert_dir }}"
        state: directory
        mode: "0700"

    - name: Create a test CA and a server certificate for the host's fqdn
      ansible.builtin.shell: |
        set -e
        openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=molecule-ca \
          -keyout ca.key -out root.crt
        openssl req -newkey rsa:2048 -nodes -subj "/CN={{ ansible_facts.fqdn }}" \
          -keyout server.key -out server.csr
        echo "subjectAltName=DNS:{{ ansible_facts.fqdn }},DNS:localhost,IP:127.0.0.1" > server.ext
        openssl x509 -req -in server.csr -CA root.crt -CAkey ca.key -CAcreateserial \
          -days 30 -extfile server.ext -out server.crt
      args:
        chdir: "{{ cert_dir }}"
        creates: "{{ cert_dir }}/server.crt"
