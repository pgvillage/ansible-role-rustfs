---
- name: Verify
  hosts: all
  tasks:
    - name: Read the service states
      ansible.builtin.service_facts:

    - name: Check that RustFS runs and is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services['rustfs.service'].state == 'running'
          - ansible_facts.services['rustfs.service'].status == 'enabled'

    - name: Check that the S3 API serves TLS with the test certificate
      ansible.builtin.uri:
        url: "https://{{ ansible_facts.fqdn }}:9091/"
        ca_path: /etc/pki/rustfs/root.crt
        status_code: [200, 403]

    - name: Check that the console listens
      ansible.builtin.wait_for:
        port: 9001
        timeout: 10

    - name: Get the home directory of the rustfs user
      ansible.builtin.getent:
        database: passwd
        key: rustfs

    - name: List the buckets with rc, over TLS
      become: true
      become_user: rustfs
      ansible.builtin.command: /usr/local/bin/rc ls rustfs
      environment:
        RC_CONFIG_DIR: "{{ getent_passwd.rustfs[4] }}/.config/rc"
      register: buckets
      changed_when: false

    - name: Check that the bucket was created
      ansible.builtin.assert:
        that: "'mybucket' in buckets.stdout"
        fail_msg: "mybucket not found in: {{ buckets.stdout }}"
