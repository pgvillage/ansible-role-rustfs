---
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start the RustFS service
  ansible.builtin.service:
    name: "{{ rustfs_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Check started
  ansible.builtin.uri:
    url: "{{ endpoint.url }}"
    validate_certs: false
    status_code: [200, 403]
  register: rustfs_curl
  until: rustfs_curl is succeeded
  retries: 60
  delay: 1
  vars:
    endpoint: "{{ __rustfs_endpoint_defaults | combine(rustfs_endpoint) }}"
