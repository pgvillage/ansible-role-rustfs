---
- name: Create folders
  ansible.builtin.file:
    state: directory
    owner: "{{ item.value.owner }}"
    path: "{{ item.value.path }}"
    mode: "0700"
  loop: "{{ rustfs_cert_folders | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> {{ item.value.path }}"

- name: Deploy certs from string
  ansible.builtin.copy:
    dest: "{{ item.value.path }}"
    content: "{{ item.value.body }}"
    owner: "{{ item.value.owner | default('root') }}"
    mode: "0600"
  loop: "{{ rustfs_cert_files | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> {{ item.value.path }}"
  when:
    - rustfs_cert_from_string
    - item.value.path != ''
  notify: Restart rustfs

- name: Deploy certs from file
  ansible.builtin.copy:
    dest: "{{ item.value.path }}"
    src: "{{ item.value.source }}"
    owner: "{{ item.value.owner | default('root') }}"
    mode: "0600"
    remote_src: "{{ rustfs_cert_remote }}"
  loop: "{{ rustfs_cert_files | dict2items }}"
  loop_control:
    label: "{{ item.value.source | default(item.key) }} -> {{ item.value.path }}"
  when:
    - not rustfs_cert_from_string
    - item.value.path != ''
    - "item.value.source | default('') != ''"
  notify: Restart rustfs
