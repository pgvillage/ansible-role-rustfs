---
- name: Install RustFS packages
  ansible.builtin.package:
    name: "{{ rustfs_package_names }}"
    state: present

- name: Generate the RustFS server envfile
  ansible.builtin.template:
    src: rustfs.env.j2
    dest: "{{ rustfs_server_envfile }}"
    owner: "root"
    group: "{{ rustfs_group }}"
    mode: "0640"
  notify: Restart rustfs

- name: Create the RustFS server systemd config
  ansible.builtin.template:
    src: rustfs.service.j2
    dest: "/etc/systemd/system/{{ rustfs_service_name }}.service"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Restart rustfs
