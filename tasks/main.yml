---
- name: Check for variables of the Minio role
  ansible.builtin.include_tasks: check_vars.yml

- name: Checking for valid certs config
  ansible.builtin.assert:
    that:
      - "'\n' in rustfs_client_cert"
      - "'\n' in rustfs_server_cert"
      - "'\n' in rustfs_server_key"
      - "'\n' in rustfs_server_chain"
    fail_msg: "Please run chainsmith to succesfully setup certs"
    success_msg: "Client and server certs seem properly setup"
  when: rustfs_cert_managed

- name: Check that the host runs systemd
  ansible.builtin.assert:
    that: ansible_facts.service_mgr == "systemd"
    fail_msg: "RustFS needs systemd, this host uses {{ ansible_facts.service_mgr }}"

- name: Check for Minio, and remove it with rustfs_remove_minio
  ansible.builtin.include_tasks: remove_minio.yml

- name: Create rustfs user, group and directories
  ansible.builtin.include_tasks: create.yml
- name: Install rustfs
  ansible.builtin.include_tasks: install.yml
- name: Deploy certificates for rustfs
  ansible.builtin.include_tasks: certs.yml
- name: Start rustfs
  ansible.builtin.include_tasks: start.yml
- name: Configure rustfs client and create buckets
  ansible.builtin.include_tasks: client.yml
